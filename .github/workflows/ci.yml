name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/ scripts/

  typecheck:
    name: Type Check (ty)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ty check --output-format github

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Qt and FFmpeg system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage gate (Linux)
        if: runner.os == 'Linux'
        run: pytest --cov=framecover --cov-report=term-missing --cov-fail-under=80
        env:
          QT_QPA_PLATFORM: offscreen
          IMAGEIO_FFMPEG_EXE: ffmpeg
      - name: Run tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: pytest --junitxml=test-results.xml
      - name: Annotate Windows test failures
        if: failure() && runner.os == 'Windows'
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("test-results.xml")
          if report.exists():
              for case in ElementTree.parse(report).iter("testcase"):
                  for result in case:
                      if result.tag not in {"failure", "error"}:
                          continue
                      text = f"{case.attrib['name']}: {result.text or result.get('message', '')}"
                      text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title=Windows pytest failure::{text}")

  benchmark:
    name: Benchmark
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0
      - run: pip install -e ".[dev]"
      - name: Run benchmarks
        run: pytest tests/benchmarks/ --benchmark-only --benchmark-max-time=1
        env:
          QT_QPA_PLATFORM: offscreen

  dist:
    name: Build distribution
    needs: [lint, typecheck, test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Build executable
        run: >
          pyinstaller pyinstaller.spec
          --distpath dist
          --workpath build
          --noconfirm
      - name: Package distribution
        run: python scripts/release.py package --platform ${{ matrix.platform }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: framecover-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
