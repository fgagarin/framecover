name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Slint build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      # Clippy runs on every OS because platform code is cfg-gated.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Slint build/runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            xvfb
      - name: Cache FFmpeg downloads
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg/.cache
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('xtask/ffmpeg-pins.toml') }}
      - name: Fetch pinned FFmpeg
        run: cargo xtask fetch-ffmpeg
      - name: Point tests at the pinned FFmpeg
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Windows-X64) p=windows-x64; ext=.exe ;;
            Linux-X64)   p=linux-x64;   ext= ;;
            Linux-ARM64) p=linux-arm64; ext= ;;
            macOS-ARM64) p=macos-arm64; ext= ;;
            macOS-X64)   p=macos-x64;   ext= ;;
            *) echo "unsupported runner $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          dir="$GITHUB_WORKSPACE/vendor/ffmpeg/$p"
          echo "FRAMECOVER_FFMPEG=$dir/ffmpeg$ext" >> "$GITHUB_ENV"
          echo "FRAMECOVER_FFPROBE=$dir/ffprobe$ext" >> "$GITHUB_ENV"
      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace --locked
      - name: Run tests
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked

  dist:
    name: Build distribution (${{ matrix.platform }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS ships one universal2 bundle built from both slices.
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Slint build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Cache FFmpeg downloads
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg/.cache
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('xtask/ffmpeg-pins.toml') }}
      - name: Fetch pinned FFmpeg
        run: cargo xtask fetch-ffmpeg
      - name: Package distribution
        run: cargo xtask package ${{ matrix.platform }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: framecover-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
