name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag and generate changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Validate versions and generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python scripts/release.py notes --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-assets/*.md
          if-no-files-found: error

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Build native distribution
        run: uv run --frozen pyinstaller pyinstaller.spec --distpath dist --workpath build --noconfirm
      - name: Package distribution
        run: uv run --frozen python scripts/release.py package --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish binaries and full changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "FrameCover $RELEASE_TAG" \
            --notes-file release-assets/release-notes.md \
            release-assets/*.tar.gz release-assets/*.exe release-assets/CHANGELOG.md
