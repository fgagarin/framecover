name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate tag and generate changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Validate versions and generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cargo xtask release notes "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-assets/*.md
          if-no-files-found: error

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Slint build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev
      # No build cache here: release binaries are always built from scratch.
      - name: Fetch pinned FFmpeg
        run: cargo xtask fetch-ffmpeg
      - name: Build and package native distribution
        run: cargo xtask package ${{ matrix.platform }}
      - name: Smoke-test the packaged app
        # Runs the shipped binary from the unpacked asset, so a missing
        # dynamic library (dyld/ld.so) or a broken bundle fails the build.
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/smoke"
          mkdir -p "$out"
          case "${{ matrix.platform }}" in
            macos)
              tar -xzf release-assets/framecover-*-macos.tar.gz -C "$out"
              "$out/framecover.app/Contents/MacOS/framecover" --version ;;
            linux)
              tar -xzf release-assets/framecover-*-linux.tar.gz -C "$out"
              "$out/framecover/framecover" --version ;;
            windows)
              ./release-assets/framecover-*-windows.exe --version
              unzip -q release-assets/framecover-*-windows-cli.zip -d "$out"
              "$out/framecover.com" --version ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  # FFmpeg linked in-process, built from source like everything else here
  # (no cache). Signed with the release key from repository secrets
  # (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
  # ANDROID_KEY_PASSWORD); without them, with a throwaway debug key.
  android:
    name: Build (android)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the Android build image
        run: docker build -t framecover-android scripts/android
      - name: Build FFmpeg libraries
        run: >
          docker run --rm -v "$PWD:/src" framecover-android
          scripts/android/build-ffmpeg.sh android-x86_64 android-arm64-v8a
      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            signing=(-v "$RUNNER_TEMP/release.jks:/keystore/release.jks:ro"
              -e ANDROID_KEYSTORE=/keystore/release.jks
              -e ANDROID_KEYSTORE_PASSWORD -e ANDROID_KEY_ALIAS -e ANDROID_KEY_PASSWORD)
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a debug key and will not update earlier installs."
          fi
          docker run --rm -v "$PWD:/src" "${signing[@]}" framecover-android cargo xtask android
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Verify the APK signature
        run: >
          docker run --rm -v "$PWD:/src" framecover-android bash -c
          'for apk in release-assets/*.apk; do /opt/android-sdk/build-tools/35.0.0/apksigner verify --print-certs "$apk"; done'
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release-assets/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish binaries and full changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "FrameCover $RELEASE_TAG" \
            --notes-file release-assets/release-notes.md \
            release-assets/*.tar.gz release-assets/*.exe release-assets/*.zip release-assets/*.apk \
            release-assets/CHANGELOG.md
