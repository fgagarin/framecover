[workspace]
resolver = "3"
members = ["crates/framecover-core", "crates/framecover-libav", "crates/framecover-app", "xtask"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"
authors = ["Fedor Gagarin"]
repository = "https://github.com/fgagarin/framecover"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
