[project]
name = "video-thumbnailer"
version = "0.1.0"
description = "Change the thumbnail icon of a video file displayed by OS file managers"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "PySide6-Essentials>=6.12.0",
    "av>=19.0.2",
    "Pillow>=13.0.0",
    "imageio-ffmpeg>=0.6.0",
    "mutagen>=1.48.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "pytest-cov>=7.1.0",
    "pytest-benchmark>=5.3.0",
    "ruff>=0.17.1",
    "pyinstaller>=6.22.3",
    "git-changelog>=2.10.0,<3",
    "ty>=0.0.90",
]

[project.scripts]
video-thumbnailer = "video_thumbnailer.app:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
branch = true
source = ["video_thumbnailer"]

[tool.git-changelog]
convention = "conventional"
provider = "github"
template = "keepachangelog"
versioning = "semver"
parse-trailers = true
sections = ["feat", "fix", "perf", "refactor", "revert", "build", "ci", "docs"]
