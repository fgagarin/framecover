# git-cliff configuration (https://git-cliff.org).
#
# Reproduces the Keep a Changelog layout previously generated by
# git-changelog, so CHANGELOG.md keeps its existing history byte for byte.
# Used by `cargo xtask release create|notes` and `cargo xtask changelog`.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](http://keepachangelog.com/en/1.0.0/)
and this project adheres to [Semantic Versioning](http://semver.org/spec/v2.0.0.html).

<!-- insertion marker -->"""
body = """
{%- set repo = "https://github.com/fgagarin/framecover" -%}
{% if version -%}
## [{{ version }}]({{ repo }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}

{% if previous.version -%}
<small>[Compare with {{ previous.version }}]({{ repo }}/compare/{{ previous.version }}...{{ version }})</small>
{%- else -%}
{%- set first = commits | last -%}
<small>[Compare with first commit]({{ repo }}/compare/{{ first.id }}...{{ version }})</small>
{%- endif %}
{% else -%}
## Unreleased

<small>[Compare with latest]({{ repo }}/compare/{{ previous.version }}...HEAD)</small>
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}) by {{ commit.author.name }}).
{%- for footer in commit.footers %}{% if not footer.breaking and "-" in footer.token %} {{ footer.token }}{{ footer.separator }} {{ footer.value }}{% endif %}{% endfor %}
{% endfor -%}
{% endfor %}
"""
footer = ""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "newest"
# Join subject lines that were wrapped without a blank line (as git-changelog did).
commit_preprocessors = [
  { pattern = '^([^\n]+)\n([^\n])', replace = "${1} ${2}" },
]
# Group names carry an ordering prefix that `striptags` removes.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance Improvements" },
  { message = "^refactor", group = "<!-- 3 -->Code Refactoring" },
  { message = "^revert", group = "<!-- 4 -->Reverts" },
  { message = "^build", group = "<!-- 5 -->Build" },
  { message = "^ci", group = "<!-- 6 -->Continuous Integration" },
  { message = "^docs", group = "<!-- 7 -->Docs" },
  { message = ".*", skip = true },
]

[bump]
# 0.x: features bump the minor version, fixes the patch version.
features_always_bump_minor = true
breaking_always_bump_major = false
