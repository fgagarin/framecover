# Pinned FFmpeg builds fetched by `cargo xtask fetch-ffmpeg`.
#
# Each platform lists one or more archives; `ffmpeg` and `ffprobe` are taken
# from them (searched by file name, wherever they sit inside the archive) and
# written to `vendor/ffmpeg/<platform>/`. Every archive is verified against
# its SHA-256 before anything is extracted.
#
# Windows / Linux: BtbN/FFmpeg-Builds, GPL static builds of the 8.1 branch.
#   Pinned to a dated *month-end* autobuild: BtbN keeps the last build of each
#   month for two years but only the latest 14 daily builds, and the floating
#   `latest` tag is overwritten daily. Hashes copied from that release's
#   `checksums.sha256`. GPL variant => includes libx264 and libaom.
#   https://github.com/BtbN/FFmpeg-Builds/releases/tag/autobuild-2026-09-30-13-08
#
# macOS: Martin Riedl's static builds (https://ffmpeg.martin-riedl.de), the
#   only source found with versioned immutable URLs, published per-file
#   `.sha256` and both arm64 and x86_64 builds. Configure line (versions.txt)
#   includes --enable-gpl --enable-version3 --enable-libx264 --enable-libaom.
#   Newest 8.x release there is 8.1.2 (BtbN's 8.1 branch is at 8.1.3).
#   NOTE: the macOS archives were pinned from the published .sha256 files and
#   have not been downloaded/verified by us yet.

[windows-x64]
# ffmpeg n8.1.3-9-g29e619e767
archives = [
  { url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-win64-gpl-8.1.zip", sha256 = "7b801cdd3a1a0bb54ae6f572187e68b4ed54f52086cfee133fab2180bfb429fa" },
]

